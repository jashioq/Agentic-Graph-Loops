[project]
name = "agl"
version = "0.1.0"
description = "Agentic Graph Loops"
requires-python = ">=3.12"
dependencies = ["rich>=13.7"]

[project.scripts]
agl = "agl.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "mypy>=1.11", "ruff>=0.6", "import-linter>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src/agl"]

[tool.importlinter]
root_package = "agl"

[[tool.importlinter.contracts]]
name = "Core modules do not import each other"
type = "independence"
modules = [
  "agl.core.terminal",
  "agl.core.agent",
  "agl.core.store",
  "agl.core.proc",
  "agl.core.vcs",
  "agl.core.dag",
  "agl.core.paths",
]

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = ["agl.cli", "agl.workflows", "agl.core"]

[[tool.importlinter.contracts]]
name = "Workflows use APIs, never implementations"
type = "forbidden"
source_modules = ["agl.workflows"]
forbidden_modules = [
  "agl.core.terminal.impl",
  "agl.core.agent.impl",
  "agl.core.store.impl",
  "agl.core.proc.impl",
  "agl.core.vcs.impl",
]