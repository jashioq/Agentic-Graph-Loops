[project]
name = "agl"
version = "0.1.0"
description = "Agentic Graph Loops"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>0.1.59",
    "rich>=13.7",
]

[project.scripts]
agl = "agl.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-xdist>=3.6",
  "mypy>=1.11",
  "ruff>=0.6",
  "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The vcs tests drive real git, and a git process costs more than the test
# around it. Serially that is half a minute; spread over cores it is seconds.
#
# This does make xdist a hard requirement: `-n` is an unrecognised argument
# without the plugin, so `-p no:xdist` fails rather than falling back. Making it
# degrade needs a real pytest plugin — `pytest_load_initial_conftests` is the
# hook that could do it, and a conftest cannot implement it, because the rootdir
# conftest is loaded *by* that hook and so registers too late. A plugin module
# is not worth it for a dev-group dependency we always install. Run `-n0`
# instead: it turns parallel off when a failure is easier to read one worker at
# a time, and it is documented in CLAUDE.md next to `uv run pytest`.
addopts = "-n auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src/agl"]

[tool.importlinter]
root_package = "agl"

[[tool.importlinter.contracts]]
name = "Core modules do not import each other"
type = "independence"
modules = [
  "agl.core.terminal",
  "agl.core.agent",
  "agl.core.store",
  "agl.core.vcs",
  "agl.core.dag",
  "agl.core.paths",
]

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = ["agl.cli", "agl.workflows", "agl.core"]

[[tool.importlinter.contracts]]
name = "Workflows use APIs, never implementations"
type = "forbidden"
source_modules = ["agl.workflows"]
forbidden_modules = [
  "agl.core.terminal.impl",
  "agl.core.agent.impl",
  "agl.core.store.impl",
  "agl.core.vcs.impl",
]
